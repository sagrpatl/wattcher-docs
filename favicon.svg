<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Wattcher app icon: a workout profile in power-zone colours with the live
       power trace on a dark rounded square. Source for `npx tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a38"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- FTP line -->
  <line x1="196" y1="452" x2="828" y2="452" stroke="#ffffff" stroke-opacity="0.22" stroke-width="8" stroke-dasharray="22 18"/>
  <!-- Zone bars (Z2 → Z6) -->
  <g>
    <rect x="200" y="600" width="100" height="180" rx="18" fill="#3d8bff"/>
    <rect x="331" y="525" width="100" height="255" rx="18" fill="#43c46a"/>
    <rect x="462" y="455" width="100" height="325" rx="18" fill="#f5c342"/>
    <rect x="593" y="370" width="100" height="410" rx="18" fill="#ff7a3d"/>
    <rect x="724" y="280" width="100" height="500" rx="18" fill="#ff3b30"/>
  </g>
  <!-- Live power trace -->
  <path d="M196 560 C 260 548, 300 500, 380 488 S 500 420, 560 410 S 660 330, 712 316 S 772 250, 792 236"
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="792" cy="236" r="34" fill="#ffffff"/>
  <circle cx="792" cy="236" r="16" fill="#ffb020"/>
</svg>
